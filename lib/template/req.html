<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{file_name}} | File ² Link</title>

<!-- Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Plyr Video Player CSS -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

<style>
  :root {
    --bg-main: #0b0b0e;
    --bg-card: #141419;
    --bg-btn: #18181d;
    --accent-purple: #8c3ce6;
    --accent-hover: #7b29d6;
    --text-main: #ffffff;
    --text-muted: #8b8b93;
    --plyr-color-main: #8c3ce6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background-color: var(--bg-main);
  }
  
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent-purple);
  }

  .brand-icon {
    width: 20px;
    height: 20px;
    background-color: var(--accent-purple);
    border-radius: 4px;
    transform: rotate(45deg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .brand-icon::after {
    content: '';
    width: 6px;
    height: 6px;
    background: #000;
    border-radius: 50%;
  }

  .brand span { color: #fff; }
  
  .share-btn {
    background: transparent;
    color: var(--text-main);
    border: 1px solid #333;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  /* Main Container */
  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 0 16px 24px 16px;
  }

  /* Video Player */
  .video-wrapper {
    width: 100%;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  /* Title & Badges */
  .file-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 12px;
    line-height: 1.4;
    word-wrap: break-word;
  }

  .badges {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .badge {
    background-color: var(--bg-card);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Primary Action Buttons */
  .action-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    transition: background 0.2s;
  }

  .btn-download {
    background-color: var(--accent-purple);
    color: #fff;
  }
  .btn-download:hover { background-color: var(--accent-hover); }

  .btn-copy {
    background-color: var(--bg-card);
    color: #fff;
  }
  .btn-copy:hover { background-color: #1a1a20; }

  /* Info Card */
  .info-card {
    background-color: var(--bg-card);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  
  .info-row {
    display: flex;
    margin-bottom: 20px;
  }
  .info-row:last-child { margin-bottom: 0; }
  
  .info-label {
    width: 80px;
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  
  .info-value {
    font-size: 0.9rem;
    color: #e4e4e7;
    word-break: break-all;
    line-height: 1.4;
  }

  /* External Players Section */
  .section-title {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    padding-left: 4px;
  }

  .players-list {
    background-color: var(--bg-card);
    border-radius: 12px;
    overflow: hidden;
  }

  .player-item {
    display: flex;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    text-decoration: none;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s;
  }
  .player-item:last-child { border-bottom: none; }
  .player-item:hover { background-color: #1a1a20; }

  .app-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    margin-right: 16px;
    flex-shrink: 0;
  }

  .icon-vlc { background-color: #ff7e00; color: #fff; }
  .icon-mx { background-color: #2196f3; color: #fff; }
  .icon-nplayer { background-color: #222; color: #fff; }
  /* Rainbow gradient for nPlayer icon */
  .icon-nplayer i {
    background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .player-info { flex-grow: 1; }
  .player-info h4 { font-size: 0.95rem; font-weight: 500; margin-bottom: 2px; }
  .player-info p { font-size: 0.75rem; color: var(--text-muted); }

  .player-arrow { color: #444; font-size: 0.9rem; }

  /* Footer */
  footer {
    text-align: center;
    padding: 40px 20px;
    margin-top: 20px;
  }
  
  .footer-brand {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .footer-brand span { color: var(--accent-purple); }
  
  .copyright {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #333;
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 0.9rem;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"></div>
      <span>File ² Link</span>
    </div>
    <button class="share-btn" onclick="copyUrl()">
      <i class="fa-solid fa-arrow-up-from-bracket"></i> Share
    </button>
  </header>

  <div class="container">
    
    <!-- Video Player -->
    <div class="video-wrapper">
      <video id="player" playsinline controls crossorigin>
        <source src="{{file_url}}" type="video/mp4">
      </video>
    </div>

    <!-- Title & Badges -->
    <div class="file-title">{{file_name}}</div>
    
    <div class="badges">
      <div class="badge"><i class="fa-solid fa-download"></i> {{file_size}}</div>
      <div class="badge"><i class="fa-solid fa-play"></i> Video Stream</div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button class="btn btn-download" onclick="downloadFile()">
        <i class="fa-solid fa-download"></i> Download
      </button>
      <button class="btn btn-copy" onclick="copyUrl()">
        <i class="fa-solid fa-link"></i> Copy Link
      </button>
    </div>

    <!-- File Information Card -->
    <div class="info-card">
      <div class="info-row">
        <div class="info-label">NAME</div>
        <div class="info-value">{{file_name}}</div>
      </div>
      <div class="info-row">
        <div class="info-label">SIZE</div>
        <div class="info-value">{{file_size}}</div>
      </div>
    </div>

    <!-- External Players -->
    <div class="section-title">Open in External Player</div>
    
    <div class="players-list">
      <!-- VLC -->
      <a class="player-item" onclick="openVLC()">
        <div class="app-icon icon-vlc"><i class="fa-solid fa-traffic-cone"></i></div>
        <div class="player-info">
          <h4>VLC</h4>
          <p>Android only</p>
        </div>
        <i class="fa-solid fa-chevron-right player-arrow"></i>
      </a>
      
      <!-- MX Player -->
      <a class="player-item" onclick="openMX()">
        <div class="app-icon icon-mx"><i class="fa-solid fa-play"></i></div>
        <div class="player-info">
          <h4>MX Player</h4>
          <p>Android & iOS</p>
        </div>
        <i class="fa-solid fa-chevron-right player-arrow"></i>
      </a>
      
      <!-- nPlayer -->
      <a class="player-item" onclick="openNPlayer()">
        <div class="app-icon icon-nplayer"><i class="fa-solid fa-play"></i></div>
        <div class="player-info">
          <h4>nPlayer</h4>
          <p>iOS & macOS</p>
        </div>
        <i class="fa-solid fa-chevron-right player-arrow"></i>
      </a>
    </div>

  </div>

  <footer>
    <div class="footer-brand">
      File ² <span>Link</span>
    </div>
    <div class="copyright">
      © 2026 Goutham Josh. All Rights Reserved.
    </div>
  </footer>

  <div id="toast" class="toast">Link Copied!</div>

  <!-- Plyr Video Player JS -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    const player = new Plyr('#player', {
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen']
    });

    const fileUrl = "{{file_url}}";
    const fileName = "{{file_name}}";

    function downloadFile() {
      const a = document.createElement('a');
      a.href = fileUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function copyUrl() {
      navigator.clipboard.writeText(fileUrl).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      });
    }

    // Android/iOS Intents
    function openVLC() {
      window.location.href = `intent:${fileUrl}#Intent;package=org.videolan.vlc;type=video/*;end;`;
    }

    function openMX() {
      window.location.href = `intent:${fileUrl}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end;`;
    }

    function openNPlayer() {
      window.location.href = `nplayer-${fileUrl}`; 
    }
  </script>
</body>
</html>
