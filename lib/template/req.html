<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{file_name}} | FILE ² LINK</title>

<!-- Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Plyr Video Player CSS -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

<style>
  :root {
    --bg-main: #0f0f0f;
    --bg-card: #1e1e1e;
    --bg-btn: #1a1a1a;
    --bg-btn-hover: #2a2a2a;
    --text-main: #ffffff;
    --text-muted: #aaaaaa;
    --accent-purple: #8b5cf6; /* Matches the player and logo accent */
    --plyr-color-main: #8b5cf6; /* Forces Plyr to use purple */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Header / Navbar */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background-color: var(--bg-main);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-wrap: wrap;
    gap: 12px;
  }
  
  .brand {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  
  .brand .purple { color: var(--accent-purple); }
  
  .nav-links {
    display: flex;
    gap: 16px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }
  
  .nav-links a { color: inherit; text-decoration: none; transition: 0.2s; cursor: pointer; }
  .nav-links a:hover { color: var(--text-main); }

  /* Main Container */
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
  }

  /* Video Player Wrapper */
  .video-wrapper {
    margin-bottom: 24px;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  /* File Info Card */
  .info-card {
    background-color: var(--bg-card);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }
  
  .info-card h2 {
    font-size: 1.1rem;
    margin-bottom: 20px;
    font-weight: 600;
  }
  
  .info-row { margin-bottom: 16px; }
  .info-row:last-child { margin-bottom: 0; }
  
  .info-label {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  
  .info-value {
    font-size: 0.95rem;
    word-break: break-all;
  }

  /* Buttons Stack */
  .btn-stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 40px;
  }
  
  .action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    background-color: var(--bg-btn);
    color: var(--text-main);
    border: none;
    border-radius: 8px;
    padding: 16px;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.2s;
  }
  
  .action-btn:hover { background-color: var(--bg-btn-hover); }
  
  .action-btn i { font-size: 1.1rem; }
  .icon-blue { color: #3b82f6; }
  .icon-orange { color: #f97316; }
  .icon-multi { background: linear-gradient(45deg, #3b82f6, #10b981, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  /* Footer */
  footer {
    text-align: center;
    padding: 20px;
    font-size: 0.8rem;
    color: var(--text-muted);
    border-top: 1px solid rgba(255,255,255,0.05);
    margin-top: 20px;
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent-purple);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 0.9rem;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <header>
    <div class="brand">FILE ² <span class="purple">LINK</span></div>
    <div class="nav-links">
      <a href="#player-section">Player</a>
      <a href="#info-section">File Info</a>
      <a href="#copyright-section">Copyright</a>
    </div>
  </header>

  <div class="container">
    
    <!-- Video Player -->
    <div id="player-section" class="video-wrapper">
      <video id="player" playsinline controls crossorigin>
        <!-- The browser will attempt to play this directly -->
        <source src="{{file_url}}" type="video/mp4">
      </video>
    </div>

    <!-- File Information Card -->
    <div id="info-section" class="info-card">
      <h2>File Information</h2>
      
      <div class="info-row">
        <div class="info-label">File Name :</div>
        <div class="info-value">{{file_name}}</div>
      </div>
      
      <div class="info-row">
        <div class="info-label">File Size :</div>
        <!-- Note: If your backend provides a {{file_size}} variable, replace 'Unknown Size' with it -->
        <div class="info-value">{{file_size}}</div> 
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-stack">
      <button class="action-btn" onclick="downloadFile()">
        <i class="fa-solid fa-download icon-blue"></i> Download Video
      </button>
      
      <button class="action-btn" onclick="copyUrl()">
        <i class="fa-solid fa-link icon-blue"></i> Copy Link
      </button>
      
      <button class="action-btn" onclick="openVLC()">
        <i class="fa-brands fa-vimeo-v icon-orange" style="transform: rotate(180deg);"></i> Watch in VLC (Android Only)
      </button>
      
      <button class="action-btn" onclick="openMX()">
        <i class="fa-solid fa-play icon-blue"></i> Watch in MX Player
      </button>

      <button class="action-btn" onclick="openNPlayer()">
        <i class="fa-solid fa-caret-right icon-multi"></i> Watch in nPlayer
      </button>
    </div>

  </div>

  <footer id="copyright-section">
    Copyright © 2026 Goutham Josh. All Rights Reserved.
  </footer>

  <div id="toast" class="toast">Link Copied!</div>

  <!-- Plyr Video Player JS -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    // Initialize the purple video player
    const player = new Plyr('#player', {
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen']
    });

    const fileUrl = "{{file_url}}";
    const fileName = "{{file_name}}";

    function downloadFile() {
      const a = document.createElement('a');
      a.href = fileUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function copyUrl() {
      navigator.clipboard.writeText(fileUrl).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      });
    }

    // Android Intent Links for external players (crucial for MKV support)
    function openVLC() {
      window.location.href = `vlc://${fileUrl}`;
    }

    function openMX() {
      window.location.href = `intent:${fileUrl}#Intent;package=com.mxtech.videoplayer.ad;end`;
    }

    function openNPlayer() {
      // Basic fallback scheme for nPlayer
      window.location.href = `nplayer-${fileUrl}`; 
    }
  </script>
</body>
</html>
